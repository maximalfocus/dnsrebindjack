[project]
name = "dnsrebindjack"
version = "0.1.0"
description = "Container-only educational demo of DNS rebinding: a TOCTOU (CWE-367) gap in hostname resolution that defeats an SSRF egress control (CWE-918). Fully simulated and local-only."
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2",
    "dnslib>=0.9.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnsrebindjack"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# dnslib ships no type information; the demo resolver isolates its use behind typed helpers.
module = ["dnslib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "topology: integration tests that require the in-network fixture container topology",
]
